services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotpotato
      POSTGRES_USER: hotpotato
      POSTGRES_PASSWORD: hotpotato
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotpotato -d hotpotato"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - hot-potato-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runner
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: runner
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: runner
    command: ["npm", "run", "start", "--workspace", "@hot-potato/web"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      HOT_POTATO_ORG: acme
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      CONNECTOR_SETUP_SECRET: ${CONNECTOR_SETUP_SECRET:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      target: runner
    command: ["npm", "run", "start", "--workspace", "@hot-potato/worker"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      WORKER_POLL_MS: 1000
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  hot-potato-data:
