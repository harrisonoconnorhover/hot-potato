services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotpotato
      POSTGRES_USER: hotpotato
      POSTGRES_PASSWORD: hotpotato
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotpotato -d hotpotato"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hot-potato-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runner
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    build:
      context: .
      target: runner
    command: ["npm", "run", "db:bootstrap"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      HOT_POTATO_ORG: ${HOT_POTATO_ORG:-acme}
      HOT_POTATO_ORG_NAME: ${HOT_POTATO_ORG_NAME:-Hot Potato Workspace}
      HOT_POTATO_ADMIN_USER: ${HOT_POTATO_ADMIN_USER:?Set HOT_POTATO_ADMIN_USER in .env}
      HOT_POTATO_ADMIN_NAME: ${HOT_POTATO_ADMIN_NAME:-}
      HOT_POTATO_ADMIN_PASSWORD: ${HOT_POTATO_ADMIN_PASSWORD:?Set HOT_POTATO_ADMIN_PASSWORD in .env}
      HOT_POTATO_RESET_ADMIN_PASSWORD: ${HOT_POTATO_RESET_ADMIN_PASSWORD:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    profiles: ["demo"]
    build:
      context: .
      target: runner
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      HOT_POTATO_ORG: ${HOT_POTATO_ORG:-acme}
      HOT_POTATO_ORG_NAME: ${HOT_POTATO_ORG_NAME:-Acme Revenue}
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: runner
    command: ["npm", "run", "start", "--workspace", "@hot-potato/web"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      HOT_POTATO_ORG: ${HOT_POTATO_ORG:-acme}
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUSTED_PROXY_CLIENT_IP_HEADER: ${TRUSTED_PROXY_CLIENT_IP_HEADER:-}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_ADDON_OAUTH_CLIENT_ID: ${GOOGLE_WORKSPACE_ADDON_OAUTH_CLIENT_ID:-}
      GOOGLE_WORKSPACE_ADDON_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_WORKSPACE_ADDON_SERVICE_ACCOUNT_EMAIL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: .
      target: runner
    command: ["npm", "run", "start", "--workspace", "@hot-potato/worker"]
    environment:
      DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      WORKER_POLL_MS: 1000
      WORKER_OPERATION_TIMEOUT_MS: ${WORKER_OPERATION_TIMEOUT_MS:-120000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  hot-potato-data:
